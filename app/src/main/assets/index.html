<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <title>影视</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=0,viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <link rel="stylesheet" href="css/ui.css">
    <script src="js/jquery.min.js" defer></script>
    <script src="js/script.js" defer></script>
</head>

<body>
    <div id="app">
        <!-- Content -->
        <div class="app-body">
            <!-- 搜索 -->
            <div id="panel1" class="tab-panel active">
                <div class="panel-content">
                    <div class="md-field">
                        <input id="keyword" class="md-input" type="text" placeholder="请输入关键字..." />
                    </div>
                    <button class="md-btn md-btn-filled md-btn-full" onclick="search()">确定</button>
                </div>
            </div>
            <!-- 推送 -->
            <div id="panel2" class="tab-panel">
                <div class="panel-content">
                    <div class="md-field">
                        <input id="push_url" class="md-input" type="text" placeholder="请输入播放网址..." />
                    </div>
                    <button class="md-btn md-btn-filled md-btn-full" onclick="push()">确定</button>
                </div>
            </div>
            <!-- 弹幕 -->
            <div id="panel3" class="tab-panel">
                <div class="panel-content">
                    <div class="field-row">
                        <div class="md-field">
                            <button class="md-btn md-btn-tonal md-btn-full" onclick="showDanmakuModeDialog()">
                                <span id="danmaku_mode_label">滚动</span>
                                <svg style="margin-left:auto;flex-shrink:0" width="18" height="18" viewBox="0 0 24 24"><path d="M0 0h24v24H0V0z" fill="none"/><path d="M7 10l5 5 5-5z" fill="currentColor"/></svg>
                            </button>
                        </div>
                        <div class="md-field">
                            <button class="md-btn md-btn-tonal md-btn-full" onclick="showDanmakuSizeDialog()">
                                <span id="danmaku_size_label">默认</span>
                                <svg style="margin-left:auto;flex-shrink:0" width="18" height="18" viewBox="0 0 24 24"><path d="M0 0h24v24H0V0z" fill="none"/><path d="M7 10l5 5 5-5z" fill="currentColor"/></svg>
                            </button>
                        </div>
                    </div>
                    <div class="md-field">
                        <input id="danmaku_text" class="md-input" type="text" placeholder="请输入弹幕内容..." />
                    </div>
                    <button class="md-btn md-btn-filled md-btn-full" onclick="sendDanmaku()">发送</button>
                </div>
            </div>
            <!-- 设置 -->
            <div id="panel4" class="tab-panel">
                <div class="panel-content">
                    <div class="md-field">
                        <input id="feed_server" class="md-input" type="text" placeholder="IP:端口，或完整 JSON 网址" />
                    </div>
                    <button onclick="saveFeed()" class="md-btn md-btn-filled md-btn-full">设置源服务器</button>
                    <div class="field-row">
                        <div class="md-field short">
                            <input id="setting_name" class="md-input" type="text" placeholder="名称" />
                        </div>
                        <div class="md-field">
                            <input id="setting_text" class="md-input" type="text" placeholder="配置" />
                        </div>
                    </div>
                    <button onclick="setting()" class="md-btn md-btn-filled md-btn-full">确定</button>
                    <div class="curtain-block">
                        <div class="curtain-title">首页按钮</div>
                        <div id="home_buttons" class="curtain-list"></div>
                    </div>
                </div>
            </div>
            <!-- 本地 -->
            <div id="panel5" class="tab-panel">
                <input type="file" id="file_uploader" onchange="onFileSelected()" multiple />
                <div class="md-toolbar">
                    <button class="md-btn md-btn-tonal" onclick="uploadFile()">上传文件</button>
                    <button class="md-btn md-btn-tonal" onclick="showNewFolderDialog()">新建文件夹</button>
                </div>
                <div id="file_list"></div>
            </div>
            <!-- 幕布 -->
            <div id="panel7" class="tab-panel">
                <div id="curtain_simple" class="panel-content">
                    <div id="curtain_status" class="curtain-title">正在连接电视…</div>
                    <div class="md-field">
                        <input id="curtain_text" class="md-input" type="text" placeholder="输入要推送的文字" />
                    </div>
                    <button class="md-btn md-btn-filled md-btn-full" onclick="curtainText()">推送文字</button>
                    <input id="curtain_push_file" type="file" accept="image/*" hidden />
                    <button class="md-btn md-btn-tonal md-btn-full" onclick="curtainPick('push')">推送图片</button>
                    <button class="md-btn md-btn-tonal md-btn-full" onclick="showCurtainPage('pushed')">已推送</button>
                    <button class="md-btn md-btn-tonal md-btn-full" onclick="curtainClearText()">全部清除</button>
                    <button class="md-btn md-btn-tonal md-btn-full" onclick="showCurtainPage('advanced')">高级设置</button>
                </div>
                <div id="curtain_pushed" class="panel-content curtain-hidden">
                    <div class="curtain-title">正在滚动</div>
                    <div id="curtain_pushes" class="curtain-list"></div>
                    <button class="md-btn md-btn-tonal md-btn-full" onclick="clearChosenPushes()">删除所选</button>
                    <button class="md-btn md-btn-tonal md-btn-full" onclick="curtainClearText()">全部清除</button>
                    <button class="md-btn md-btn-tonal md-btn-full" onclick="showCurtainPage('simple')">返回</button>
                </div>
                <div id="curtain_advanced" class="panel-content curtain-hidden">
                    <button class="md-btn md-btn-tonal" onclick="showCurtainPage('simple')">返回</button>
                    <div class="curtain-block">
                        <div class="curtain-title">背景色</div>
                        <div class="curtain-row" id="curtain_colors"></div>
                        <input id="curtain_color" class="md-input" type="color" value="#101114" />
                    </div>
                    <div class="curtain-block">
                        <div class="curtain-title">背景图</div>
                        <select id="curtain_image_fit" class="md-input">
                            <option value="fit">完整显示</option>
                            <option value="fill">铺满</option>
                        </select>
                        <input id="curtain_image_file" type="file" accept="image/*" hidden />
                        <div class="curtain-row">
                            <button class="md-btn md-btn-tonal" onclick="curtainPick('image')">上传图片</button>
                            <button class="md-btn md-btn-tonal" onclick="curtainPost({do:'clearImage'})">去掉图片</button>
                        </div>
                    </div>
                    <div class="curtain-block">
                        <div class="curtain-title">背景视频</div>
                        <select id="curtain_video_fit" class="md-input">
                            <option value="fit">完整显示</option>
                            <option value="fill">铺满</option>
                        </select>
                        <input id="curtain_video_file" type="file" accept="video/*" hidden />
                        <div class="curtain-row">
                            <button class="md-btn md-btn-tonal" onclick="curtainPick('video')">上传视频</button>
                            <button class="md-btn md-btn-tonal" onclick="curtainPost({do:'clearVideo'})">去掉视频</button>
                        </div>
                    </div>
                    <div class="curtain-block">
                        <div class="curtain-title">声音</div>
                        <select id="curtain_audio" class="md-input">
                            <option value="video">视频原声</option>
                            <option value="music">背景音乐</option>
                        </select>
                        <select id="curtain_music_mode" class="md-input">
                            <option value="list">列表循环</option>
                            <option value="single">单曲循环</option>
                            <option value="shuffle">随机播放</option>
                        </select>
                        <input id="curtain_volume" type="range" min="0" max="100" value="80" />
                        <input id="curtain_music_file" type="file" accept="audio/*" hidden />
                        <div class="curtain-row">
                            <button class="md-btn md-btn-tonal" onclick="curtainPick('music')">上传音乐</button>
                            <button class="md-btn md-btn-tonal" onclick="curtainMusic('play')">播放</button>
                            <button class="md-btn md-btn-tonal" onclick="curtainMusic('pause')">暂停</button>
                            <button class="md-btn md-btn-tonal" onclick="curtainMusic('next')">下一首</button>
                        </div>
                        <div id="curtain_music" class="curtain-list"></div>
                    </div>
                    <div class="curtain-block">
                        <div class="curtain-title">常驻文字</div>
                        <input id="curtain_resident" class="md-input" type="text" placeholder="例如：生日快乐，留空则取消" />
                        <div class="curtain-row">
                            <input id="curtain_resident_size" class="md-input" type="number" min="24" max="96" value="56" placeholder="字号" />
                            <input id="curtain_resident_seconds" class="md-input" type="number" min="0" max="3600" value="0" placeholder="秒，0 为一直显示" />
                        </div>
                        <div class="curtain-row">
                            <input id="curtain_resident_color" type="color" value="#FFFFFF" />
                            <label class="curtain-check"><input id="curtain_resident_stroke" type="checkbox" checked />描边</label>
                            <button class="md-btn md-btn-filled" onclick="curtainResident()">设置</button>
                        </div>
                    </div>
                    <div class="curtain-row">
                        <button class="md-btn md-btn-tonal" onclick="curtainPost({do:'restore'})">恢复默认背景</button>
                        <button class="md-btn md-btn-tonal" onclick="curtainPost({do:'clearCache'})">清空缓存</button>
                    </div>
                    <div id="curtain_cache" class="curtain-title"></div>
                </div>
            </div>
            <!-- Bilibili 过滤 -->
            <div id="panel6" class="tab-panel">
                <div class="panel-content">
                    <label class="md-switch-row">
                        <span>启用过滤</span>
                        <input id="bili_filter_on" class="md-switch" type="checkbox" />
                    </label>
                    <div class="md-field">
                        <input id="bili_filter_words" class="md-input" type="text" placeholder="多个词用空格隔开，标题包含则不显示" />
                    </div>
                </div>
            </div>
            <!-- 字幕 -->
            <div id="panel8" class="tab-panel">
                <div class="panel-content">
                    <div class="curtain-block">
                        <div class="curtain-title">密钥</div>
                        <div class="md-field">
                            <input id="assrt_token" class="md-input" type="password" placeholder="粘贴 32 位密钥" autocomplete="off" />
                        </div>
                        <button class="md-btn md-btn-filled md-btn-full" type="button" onclick="saveAssrtToken()">保存</button>
                        <div id="assrt_token_state" class="assrt-status"></div>
                        <div id="assrt_token_status" class="assrt-status"></div>
                        <a class="assrt-credit" href="https://assrt.net" target="_blank" rel="noopener">字幕服务由assrt.net提供</a>
                    </div>
                    <div class="curtain-block">
                        <div class="curtain-title">搜索</div>
                        <div class="md-field">
                            <input id="assrt_q" class="md-input" type="text" placeholder="片名" />
                        </div>
                        <button class="md-btn md-btn-filled md-btn-full" type="button" onclick="searchAssrt()">搜索</button>
                        <div id="assrt_search_status" class="assrt-status"></div>
                    </div>
                    <div class="curtain-block">
                        <div class="curtain-title">结果</div>
                        <div id="assrt_results" class="curtain-list"></div>
                        <div id="assrt_result_status" class="assrt-status"></div>
                    </div>
                </div>
            </div>
        </div>
        <!-- M3 Navigation Bar -->
        <nav class="md-nav-bar">
            <div id="tab1" class="md-nav-item active" onclick="showPanel(1)">
                <div class="md-nav-indicator">
                    <svg class="md-nav-icon" viewBox="0 0 24 24"><path d="M0 0h24v24H0V0z" fill="none"/><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                </div>
                <span class="md-nav-label">搜索</span>
            </div>
            <div class="md-nav-slot">
                <button id="moreToggle" class="md-nav-more" type="button" onclick="toggleMore(event)" aria-label="更多">▲</button>
                <div id="moreMenu" class="md-more-menu">
                    <button class="md-more-item" type="button" data-panel="2" onclick="pickMiddle(2)">推送</button>
                    <button class="md-more-item" type="button" data-panel="3" onclick="pickMiddle(3)">弹幕</button>
                    <button class="md-more-item" type="button" data-panel="5" onclick="pickMiddle(5)">本地</button>
                    <button class="md-more-item" type="button" data-panel="6" onclick="pickMiddle(6)">Bilibili</button>
                    <button class="md-more-item" type="button" data-panel="7" onclick="pickMiddle(7)">幕布</button>
                    <button class="md-more-item" type="button" data-panel="8" onclick="pickMiddle(8)">字幕</button>
                </div>
                <div id="tabMid" class="md-nav-item" onclick="showMiddle()">
                    <div class="md-nav-indicator">
                        <svg id="midIcon" class="md-nav-icon" viewBox="0 0 24 24"><path d="M0 0h24v24H0V0z" fill="none"/><path id="midIconPath" d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM19 18H6c-2.21 0-4-1.79-4-4 0-2.05 1.53-3.76 3.56-3.97l1.07-.11.5-.95C8.08 7.14 9.94 6 12 6c2.62 0 4.88 1.86 5.39 4.43l.3 1.5 1.53.11c1.56.1 2.78 1.41 2.78 2.96 0 1.65-1.35 3-3 3zM8 13h2.55v3h2.9v-3H16l-4-4z"/></svg>
                    </div>
                    <span id="midLabel" class="md-nav-label">推送</span>
                </div>
            </div>
            <div id="tab4" class="md-nav-item" onclick="showPanel(4)">
                <div class="md-nav-indicator">
                    <svg class="md-nav-icon" viewBox="0 0 24 24"><path d="M0 0h24v24H0V0z" fill="none"/><path d="M19.43 12.98c.04-.32.07-.64.07-.98 0-.34-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.09-.16-.26-.25-.44-.25-.06 0-.12.01-.17.03l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.25 0-.46.18-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.06-.02-.12-.03-.18-.03-.17 0-.34.09-.43.25l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98 0 .33.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.09.16.26.25.44.25.06 0 .12-.01.17-.03l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.06.02.12.03.18.03.17 0 .34-.09.43-.25l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zm-1.98-1.71c.04.31.05.52.05.73 0 .21-.02.43-.05.73l-.14 1.13.89.7 1.08.84-.7 1.21-1.27-.51-1.04-.42-.9.68c-.43.32-.84.56-1.25.73l-1.06.43-.16 1.13-.2 1.35h-1.4l-.19-1.35-.16-1.13-1.06-.43c-.43-.18-.83-.41-1.23-.71l-.91-.7-1.06.43-1.27.51-.7-1.21 1.08-.84.89-.7-.14-1.13c-.03-.31-.05-.54-.05-.74s.02-.43.05-.73l.14-1.13-.89-.7-1.08-.84.7-1.21 1.27.51 1.04.42.9-.68c.43-.32.84-.56 1.25-.73l1.06-.43.16-1.13.2-1.35h1.39l.19 1.35.16 1.13 1.06.43c.43.18.83.41 1.23.71l.91.7 1.06-.43 1.27-.51.7 1.21-1.07.85-.89.7.14 1.13zM12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm0 6c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/></svg>
                </div>
                <span class="md-nav-label">设置</span>
            </div>
        </nav>
    </div>
    <!-- Dialog: 弹幕模式 -->
    <div id="danmakuModeDialog" class="md-dialog-overlay">
        <div class="md-dialog">
            <div class="md-dialog-title">模式</div>
            <div class="md-dialog-list">
                <div class="md-dialog-list-item active" data-val="1" onclick="setDanmakuMode(1,'滚动')"><span>滚动</span></div>
                <div class="md-dialog-list-item" data-val="5" onclick="setDanmakuMode(5,'顶部')"><span>顶部</span></div>
                <div class="md-dialog-list-item" data-val="4" onclick="setDanmakuMode(4,'底部')"><span>底部</span></div>
                <div class="md-dialog-list-item" data-val="6" onclick="setDanmakuMode(6,'反向')"><span>反向</span></div>
            </div>
        </div>
    </div>
    <!-- Dialog: 弹幕大小 -->
    <div id="danmakuSizeDialog" class="md-dialog-overlay">
        <div class="md-dialog">
            <div class="md-dialog-title">大小</div>
            <div class="md-dialog-list">
                <div class="md-dialog-list-item" data-val="18" onclick="setDanmakuSize(18,'小')"><span>小</span></div>
                <div class="md-dialog-list-item active" data-val="25" onclick="setDanmakuSize(25,'默认')"><span>默认</span></div>
                <div class="md-dialog-list-item" data-val="36" onclick="setDanmakuSize(36,'大')"><span>大</span></div>
            </div>
        </div>
    </div>
    <!-- Dialog: 本地路径 -->
    <div id="fileInfoDialog" class="md-dialog-overlay">
        <div class="md-dialog">
            <div class="md-dialog-title">本地路径</div>
            <div class="md-dialog-body" id="fileUrl"></div>
            <div class="md-dialog-actions">
                <button onclick="pushFile(0)" class="md-dialog-btn">关闭</button>
                <button onclick="pushFile(1)" class="md-dialog-btn">使用</button>
            </div>
        </div>
    </div>
    <!-- Dialog: 确认上传 -->
    <div id="uploadTip" class="md-dialog-overlay">
        <div class="md-dialog">
            <div class="md-dialog-title">确认上传？</div>
            <div class="md-dialog-body" id="uploadTipContent"></div>
            <div class="md-dialog-actions">
                <button onclick="confirmUpload(0)" class="md-dialog-btn">取消</button>
                <button onclick="confirmUpload(1)" class="md-dialog-btn">确定</button>
            </div>
        </div>
    </div>
    <!-- Dialog: 新建文件夹 -->
    <div id="newFolder" class="md-dialog-overlay">
        <div class="md-dialog">
            <div class="md-dialog-title">新建文件夹</div>
            <div class="md-dialog-body">
                <input id="newFolderContent" class="md-input" type="text" placeholder="请输入文件夹名称..." />
            </div>
            <div class="md-dialog-actions">
                <button onclick="confirmNewFolder(0)" class="md-dialog-btn">取消</button>
                <button onclick="confirmNewFolder(1)" class="md-dialog-btn">确定</button>
            </div>
        </div>
    </div>
    <!-- Dialog: 删除文件夹 -->
    <div id="delFolder" class="md-dialog-overlay">
        <div class="md-dialog">
            <div class="md-dialog-title">删除文件夹</div>
            <div class="md-dialog-body" id="delFolderContent"></div>
            <div class="md-dialog-actions">
                <button onclick="confirmDelFolder(0)" class="md-dialog-btn">取消</button>
                <button onclick="confirmDelFolder(1)" class="md-dialog-btn error">删除</button>
            </div>
        </div>
    </div>
    <!-- Dialog: 删除文件 -->
    <div id="delFile" class="md-dialog-overlay">
        <div class="md-dialog">
            <div class="md-dialog-title">删除文件</div>
            <div class="md-dialog-body" id="delFileContent"></div>
            <div class="md-dialog-actions">
                <button onclick="confirmDelFile(0)" class="md-dialog-btn">取消</button>
                <button onclick="confirmDelFile(1)" class="md-dialog-btn error">删除</button>
            </div>
        </div>
    </div>
    <!-- Snackbar: 警告 -->
    <div id="warnToast">
        <div class="md-snackbar" id="warnToastContent"></div>
    </div>
    <!-- Loading -->
    <div id="loadingToast">
        <div class="md-progress-wrap">
            <svg class="md-progress" viewBox="0 0 48 48">
                <circle cx="24" cy="24" r="20"/>
            </svg>
        </div>
    </div>
</body>
</html>
