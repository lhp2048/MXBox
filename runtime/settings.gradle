pluginManagement {
    repositories {
        maven { url = 'https://maven.aliyun.com/repository/gradle-plugin' }
        maven { url = 'https://maven.aliyun.com/repository/google' }
        maven { url = 'https://maven.aliyun.com/repository/central' }
        maven { url = 'https://maven.aliyun.com/repository/public' }
        maven { url = 'https://repo.huaweicloud.com/repository/maven/' }
        maven { url = 'https://mirrors.cloud.tencent.com/nexus/repository/maven-public/' }
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        maven { url = 'https://maven.aliyun.com/repository/google' }
        maven { url = 'https://maven.aliyun.com/repository/central' }
        maven { url = 'https://maven.aliyun.com/repository/public' }
        maven { url = 'https://repo.huaweicloud.com/repository/maven/' }
        maven { url = 'https://mirrors.cloud.tencent.com/nexus/repository/maven-public/' }
        maven { url = 'https://jitpack.io' }
    }
    versionCatalogs {
        libs {
            from(files('../gradle/libs.versions.toml'))
        }
    }
}

rootProject.name = 'runtime'

include ':catvod'
project(':catvod').projectDir = file('../catvod')
def engines = [python: 'chaquo', nodejs: 'nodejs', quickjs: 'quickjs', thunder: 'thunder']
def engine = engines[providers.gradleProperty('tvRuntimeModule').getOrElse('')]
if (engine != null) {
    include ":${engine}"
    project(":${engine}").projectDir = file("../${engine}")
}
